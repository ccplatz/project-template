name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck bin/*.sh tests/bin/*.sh

      - name: Guardrails
        run: ./bin/guardrails-check --ci

      - name: Run tests
        run: |
          ./tests/bin/project_config_test.sh
          ./tests/bin/worktree_test.sh
          ./tests/bin/template_sync_test.sh
          ./tests/bin/template_release_test.sh
          ./tests/bin/release_test.sh
